# Render deployment config.
#
# Render reads this automatically when you create a Blueprint from the repo:
# it provisions the Postgres database, wires DATABASE_URL in, generates a
# secret key, and runs migrations on every deploy.
#
# See DEPLOY.md for the step-by-step.

databases:
  - name: portfolio-db
    databaseName: portfolio
    plan: free
    region: frankfurt

services:
  - type: web
    name: portfolio
    runtime: python
    plan: free
    region: frankfurt
    branch: main

    buildCommand: "./render_build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"

    healthCheckPath: /

    envVars:
      # Supplied automatically by the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

      # Render generates a strong random value on first deploy.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,surajportfolio.com,www.surajportfolio.com"

      - key: CONTACT_NOTIFY_EMAIL
        value: surajpande20554@gmail.com

      - key: DEFAULT_FROM_EMAIL
        value: portfolio@surajportfolio.com

      - key: GITHUB_USERNAMES
        value: "surazzpande,Pande-Suraj"

      - key: PYTHON_VERSION
        value: "3.12.7"

      # Email notifications are optional — add EMAIL_HOST, EMAIL_PORT,
      # EMAIL_HOST_USER and EMAIL_HOST_PASSWORD in the Render dashboard
      # when you want them. Messages always save to the database regardless.
